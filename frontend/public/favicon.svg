<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1424" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="16" />

  <!-- RepoMind Brand Icon: Git Repository Branch + AI Neural Nodes -->
  <g filter="url(#glow)">
    <!-- Main Git Branch Line -->
    <path d="M 176 136 V 376" stroke="url(#iconGradient)" stroke-width="32" stroke-linecap="round" />

    <!-- Top Branch (Neural connection) -->
    <path d="M 176 256 C 230 256 260 160 336 160" fill="none" stroke="url(#iconGradient)" stroke-width="32" stroke-linecap="round" />

    <!-- Bottom Branch (Neural connection) -->
    <path d="M 176 276 C 230 276 260 352 336 352" fill="none" stroke="url(#iconGradient)" stroke-width="32" stroke-linecap="round" />

    <!-- Git Branch Nodes / Neurons -->
    <circle cx="176" cy="136" r="30" fill="#080c14" stroke="#818cf8" stroke-width="20" />
    <circle cx="176" cy="136" r="10" fill="#38bdf8" />

    <circle cx="176" cy="376" r="30" fill="#080c14" stroke="#6366f1" stroke-width="20" />
    <circle cx="176" cy="376" r="10" fill="#38bdf8" />

    <circle cx="336" cy="160" r="34" fill="#080c14" stroke="#38bdf8" stroke-width="20" />
    <circle cx="336" cy="160" r="12" fill="#818cf8" />

    <circle cx="336" cy="352" r="30" fill="#080c14" stroke="#38bdf8" stroke-width="20" />
    <circle cx="336" cy="352" r="10" fill="#6366f1" />

    <!-- Central AI Node Spark -->
    <circle cx="236" cy="256" r="14" fill="#38bdf8" />
  </g>
</svg>